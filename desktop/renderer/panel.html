<!doctype html>
<meta charset="utf-8">
<title>Dayzeros</title>
<style>
  :root{
    --cream:#f7f5f1; --ink:#1b1a17; --muted:#8b8478; --rust:#c4502a;
    --serif:'Playfair Display',Georgia,'Times New Roman',serif;
    --mono:'Space Mono',Menlo,ui-monospace,monospace;
  }
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;
    -webkit-user-select:none;user-select:none}
  #card{
    position:absolute;inset:8px;background:var(--cream);color:var(--ink);
    border-radius:22px;padding:20px;box-sizing:border-box;
    box-shadow:0 20px 44px -18px rgba(6,9,26,.75);
    display:flex;flex-direction:column;align-items:center;
    -webkit-app-region:drag;
  }
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:2.6px;
    text-transform:uppercase;color:var(--muted);align-self:flex-start}
  .clock{font-family:var(--serif);font-size:62px;line-height:1;margin:14px 0 2px;
    font-variant-numeric:tabular-nums}
  .sub{font-family:var(--mono);font-size:10px;letter-spacing:2.2px;
    text-transform:uppercase;color:var(--muted)}
  .row{display:flex;gap:8px;margin-top:18px;-webkit-app-region:no-drag}
  button{font-family:var(--mono);font-size:12px;border:none;border-radius:999px;
    padding:10px 18px;cursor:pointer;transition:filter .15s}
  button:hover{filter:brightness(.95)}
  .primary{background:var(--ink);color:var(--cream)}
  .ghost{background:rgba(27,26,23,.07);color:var(--ink)}
  .modes{display:flex;gap:6px;margin-top:14px;-webkit-app-region:no-drag}
  .modes button{font-size:10.5px;padding:7px 13px;background:transparent;
    color:var(--muted);box-shadow:inset 0 0 0 1px rgba(27,26,23,.14)}
  .modes button.on{background:var(--ink);color:var(--cream);box-shadow:none}
  .bar{width:100%;height:4px;border-radius:999px;background:rgba(27,26,23,.1);
    margin-top:16px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--rust);
    transition:width .4s linear}
  .dots{display:flex;gap:5px;margin-top:12px}
  .dots span{width:6px;height:6px;border-radius:50%;background:rgba(27,26,23,.16)}
  .dots span.on{background:var(--rust)}
</style>

<div id="card">
  <div class="eyebrow" id="eyebrow">Focus session 1 of 4</div>
  <div class="clock" id="clock">25:00</div>
  <div class="sub" id="sub">ready when you are</div>

  <div class="bar"><i id="fill"></i></div>
  <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>

  <div class="row">
    <button class="primary" id="toggle">Start</button>
    <button class="ghost" id="reset">Reset</button>
  </div>

  <div class="modes">
    <button id="m-focus">Focus · 25</button>
    <button id="m-break">Break · 5</button>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  function render(s) {
    $('clock').textContent = s.label;
    $('eyebrow').textContent =
      s.mode === 'focus' ? `Focus session ${s.session} of 4` : 'Break';
    $('sub').textContent = s.running
      ? (s.mode === 'focus' ? 'focusing — everything else can wait' : 'step away from the screen')
      : 'ready when you are';
    $('toggle').textContent = s.running ? 'Pause' : 'Start';
    $('fill').style.width = (s.progress * 100) + '%';
    $('m-focus').classList.toggle('on', s.mode === 'focus');
    $('m-break').classList.toggle('on', s.mode === 'break');
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < s.session - 1));
  }

  $('toggle').onclick = () => window.dayzeros.toggle();
  $('reset').onclick = () => window.dayzeros.reset();
  $('m-focus').onclick = () => window.dayzeros.setMode('focus');
  $('m-break').onclick = () => window.dayzeros.setMode('break');
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') window.dayzeros.closePanel();
  });

  window.dayzeros.onState(render);
  window.dayzeros.get().then(render);
</script>
